# Suppress future-incompat warnings from third-party dependencies
# block v0.1.6 (transitive dep of metal-rs/objc) has an uninhabited static
# that will become a hard error in a future Rust release.  No patched version
# exists upstream; this allowance is the pragmatic fix.
[target.'cfg(all())']
rustflags = ["-A", "uninhabited-static"]

# Prism's local Apple-Silicon artifacts target the deployment machine rather
# than a generic AArch64 baseline. Keep the existing third-party allowance in
# this target-specific override because Cargo selects only one rustflags table.
[target.aarch64-apple-darwin]
rustflags = [
    "-A",
    "uninhabited-static",
    "-C",
    "target-cpu=apple-m1",
]

[future-incompat-report]
frequency = "never"

# Homebrew LLVM — build scripts (tblgen, mlir-sys) need llvm-config in PATH.
[env]
LLVM_CONFIG_PATH = { value = "/opt/homebrew/opt/llvm/bin/llvm-config" }
