name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS (Apple Silicon) — full Metal + ANE build
  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build (prism-backend)
        run: cargo build -p tribunus-compute-core --features prism-backend
      - name: Test lib (embed_cluster, no GPU)
        run: cargo test -p tribunus-compute-core --lib --features prism-backend

  # Linux — CPU-only backend
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build (backend-cpu)
        run: cargo build -p tribunus-compute-core --features backend-cpu
      - name: Test lib (embed_cluster, pure Rust tests)
        run: cargo test -p tribunus-compute-core --lib --features backend-cpu -- embed_cluster
      - name: Clippy (lib only, skip broken bins/tests)
        run: cargo clippy -p tribunus-compute-core --features backend-cpu --lib -- -D warnings
