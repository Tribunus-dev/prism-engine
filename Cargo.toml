[package]
name = "prism-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native compute-image runtime and governed inference kernel for Apple Silicon"
autobins = false

[lib]
name = "prism_engine"
path = "src/lib.rs"

[[bin]]
name = "prism"
path = "src/bin/prism.rs"
test = false

[[bin]]
name = "prism-validate"
path = "src/bin/prism-validate.rs"

[[bin]]
name = "prism-probe"
path = "src/bin/prism-probe.rs"

[[bin]]
name = "prism-plan"
path = "src/bin/prism-plan.rs"

[[bin]]
name = "prism-render"
path = "src/bin/prism-render.rs"

[[bin]]
name = "prism-inspect"
path = "src/bin/prism-inspect.rs"

[[bin]]
name = "prism-simulate-sn40l"
path = "src/bin/prism-simulate-sn40l.rs"

[[bin]]
name = "prism-explain-plan"
path = "src/bin/prism-explain-plan.rs"

[[bin]]
name = "prism-model-manifest"
path = "src/bin/prism-model-manifest.rs"

[[bin]]
name = "prism-compare"
path = "src/bin/prism-compare.rs"

[[bin]]
name = "prism-workload-manifest"
path = "src/bin/prism-workload-manifest.rs"

[[bin]]
name = "prism-diff"
path = "src/bin/prism-diff.rs"


[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bincode = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
coreml-proto = "0.1.0"
crossbeam-channel = "0.5"
dirs = "6"
futures = "0.3"
futures-util = "0.3"
hf-hub = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = { workspace = true }
libloading = "0.8"
nix = { version = "0.29", features = ["fs"] }
parking_lot = "0.12"
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
rayon = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
safetensors = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
signal-hook = "0.3"
smallvec = "1"
sysinfo = "0.32"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
redis = "0.27"
url = "2"
metal = "0.32"
objc = "0.2"
half = "2"
tempfile = "3"
prism-ecs-ir = { path = "crates/prism-ecs-ir" }
prism-ecs-core = { path = "crates/prism-ecs-core" }
prism-spatial-ir = { path = "crates/prism-spatial-ir" }
prism-ecs-quantization = { path = "crates/prism-ecs-quantization" }
prism-ecs-server = { path = "crates/prism-ecs-server" }
prism-ecs-duckdb = { path = "crates/prism-ecs-duckdb" }
prism-ecs-compile = { path = "crates/prism-ecs-compile", features = ["phase4_evaluation", "ane", "metal-dispatch"] }
prism-ecs-constitutional = { path = "crates/prism-ecs-constitutional" }
prism-ecs-runtime = { path = "crates/prism-ecs-runtime" }
prism-ecs-kernel = { path = "crates/prism-ecs-kernel" }
prism-audio = { path = "crates/prism-audio" }
prism-video = { path = "crates/prism-video" }
prism-kv-cache = { path = "crates/prism-kv-cache" }
prism-gguf = { path = "crates/prism-gguf" }
prism-mcp-core = { path = "prism-mcp-core" }
prism-mcp-model = { path = "prism-mcp-model" }
prism-mcp-build = { path = "prism-mcp-build" }
prism-mcp-kernel = { path = "prism-mcp-kernel" }
prism-mcp-admission = { path = "prism-mcp-admission" }
prism-mcp-bench = { path = "prism-mcp-bench" }
prism-mcp-replay = { path = "prism-mcp-replay" }
prism-mcp-trace = { path = "prism-mcp-trace" }
prism-mcp-lab = { path = "prism-mcp-lab" }
prism-mcp-browser = { path = "prism-mcp-browser" }
prism-multimodal = { path = "crates/prism-multimodal" }

[features]
default = ["daemon", "trifecta"]
daemon = ["trifecta"]
trifecta = []
live-trifecta = ["trifecta"]
measure = ["trifecta", "prism-ecs-server/measure", "prism-ecs-server/gguf-compile"]
metal-dispatch = ["prism-ecs-server/metal-dispatch"]
ane = ["prism-ecs-server/metal-dispatch"]
gguf-compile = ["prism-ecs-quantization/gguf-compile", "prism-ecs-ir/gguf-compile", "prism-ecs-server/gguf-compile"]
server = ["daemon"]

[workspace]
resolver = "2"

members = [
    ".",
    "evidence-schema",
    "prism-ffi",
    "prism-mcp-model",
    "prism-mcp-build",
    "prism-mcp-kernel",
    "prism-mcp-admission",
    "prism-mcp-bench",
    "prism-mcp-replay",
    "prism-mcp-trace",
    "prism-mcp-lab",
    "prism-mcp-browser",
    "prism-mcp-core",
    "crates/prism-ecs-backend",
    "crates/prism-ecs-core",
    "crates/prism-ecs-constitutional",
    "crates/prism-ecs-ffi",
    "crates/prism-ecs-quantization",
    "crates/prism-ecs-runtime",
    "crates/prism-ecs-protocol",
    "crates/prism-ecs-protocol-adapter",
    "crates/prism-kv-cache",
    "crates/prism-ecs-ir",
    "crates/prism-ecs-server",
    "crates/prism-ane",
    "crates/prism-ane-runtime",
    "crates/prism-audio",
    "crates/prism-image",
    "crates/prism-multimodal",
    "crates/prism-video",
    "crates/prism-ecs-duckdb",
    "crates/prism-gguf",
    "crates/prism-ecs-agent",
    "crates/prism-ecs-artifact",
    "crates/prism-onnx-ingest",
    "crates/prism-ecs-daemon",
    "crates/prism-spatial-ir",
    "crates/prism-pytorch-ingest",
    "crates/prism-plugin",
    "prism-mcp-handlers",
    "crates/prism-ecs-compile",
    "crates/prism-ecs-codec",
    "crates/prism-ecs-kernel",
    "crates/prism-ecs-search",
    "crates/prism-ecs-data",
    "crates/prism-rocm-runtime",
    "crates/prism-cuda-runtime",
    "crates/prism-amd-npu-runtime",
    "crates/prism-docs-content",
    "crates/prism-docs-runtime",
    "crates/prism-docs-ssg",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Tribunus Dev"]
repository = "https://github.com/Tribunus-dev/prism-engine"
documentation = "https://github.com/Tribunus-dev/prism-engine"
keywords = ["inference", "apple-silicon", "metal", "machine-learning"]
categories = ["science"]

[workspace.dependencies]
# Core
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1"
float_eq = "1"
pretty_assertions = "1.4.0"
dyn-clone = "1"
mach-sys = "0.5"
num-complex = "0.4"
num_enum = "0.7"
paste = "1"
itertools = "0.14"
bindgen = "0.72"
cmake = "0.1"
cc = "1"
memmap2 = "0.9"
syn = { version = "2", features = ["full"] }
quote = "1"
darling = "0.21"
proc-macro2 = "1"
libc = "0.2"
qwen3-tts-mlx = { path = "models/qwen3-tts-mlx" }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
rand = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Data structures
hashbrown = "0.14"
indexmap = "2"
dashmap = "5"
smallvec = "1"

# Concurrency
parking_lot = "0.12"
rayon = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Math
num-traits = "0.2"
num-derive = "0.4"

# Crypto
blake3 = "1"
sha2 = "0.10"
hex = "0.4"

# Compression
half = { version = "2", features = ["serde"] }
safetensors = "0.8"
md5 = "0.7"
flate2 = "1"

# Filesystem
tempfile = "3"

# Docs site ECS
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }
toml = "0.8"
walkdir = "2"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "Node", "HtmlElement", "console"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

# Network
reqwest = { version = "0.11", features = ["json", "stream"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
rstest = "0.18"

# Utilities
strum = { version = "0.25", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

# Apple
core-foundation = "0.9"
core-graphics = "0.23"
foreign-types = "0.3"
block = "0.1"

# ML
ndarray = "0.15"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# Workspace-local path dependencies (not published)
prism-ecs-core = { path = "crates/prism-ecs-core" }
prism-docs-content = { path = "crates/prism-docs-content" }
prism-docs-runtime = { path = "crates/prism-docs-runtime" }
prism-ecs-runtime = { path = "crates/prism-ecs-runtime" }
prism-ecs-constitutional = { path = "crates/prism-ecs-constitutional" }
prism-ecs-source = { path = "crates/prism-ecs-source" }
prism-ecs-compile = { path = "crates/prism-ecs-compile", features = ["phase4_evaluation", "ane", "metal-dispatch"] }
prism-ecs-codec = { path = "crates/prism-ecs-codec" }
prism-ecs-kernel = { path = "crates/prism-ecs-kernel" }
prism-ecs-server = { path = "crates/prism-ecs-server" }
prism-ecs-duckdb = { path = "crates/prism-ecs-duckdb" }
prism-ecs-ir = { path = "crates/prism-ecs-ir" }
prism-spatial-ir = { path = "crates/prism-spatial-ir" }
prism-ecs-backend = { path = "crates/prism-ecs-backend" }
prism-ecs-quantization = { path = "crates/prism-ecs-quantization" }
prism-ane = { path = "crates/prism-ane" }
prism-audio = { path = "crates/prism-audio" }
prism-image = { path = "crates/prism-image" }
prism-multimodal = { path = "crates/prism-multimodal" }
prism-video = { path = "crates/prism-video" }
prism-onnx-ingest = { path = "crates/prism-onnx-ingest" }
prism-pytorch-ingest = { path = "crates/prism-pytorch-ingest" }
prism-plugin = { path = "crates/prism-plugin" }
prism-kv-cache = { path = "crates/prism-kv-cache" }
prism-gguf = { path = "crates/prism-gguf" }
prism-ecs-daemon = { path = "crates/prism-ecs-daemon" }
prism-ecs-artifact = { path = "crates/prism-ecs-artifact" }
prism-ecs-agent = { path = "crates/prism-ecs-agent" }
prism-ecs-search = { path = "crates/prism-ecs-search" }
prism-ecs-data = { path = "crates/prism-ecs-data" }

[workspace.lints.rust]
unused = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"
unused_parens = "warn"
unused_unsafe = "warn"
unused_extern_crates = "warn"
unused_qualifications = "warn"
unused_results = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module-name-repetitions = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"
must-use-candidate = "allow"
similar-names = "allow"
too-many-lines = "allow"
type-complexity = "allow"
unnecessary-wraps = "allow"
unused-self = "allow"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
