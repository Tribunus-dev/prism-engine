[package]
name = "tribunus-compute-core"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false
description = "Tribunus Compute Kernel — core MLX backend"

[lib]
name = "tribunus_compute_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
metal = { version = "0.32", optional = true }
objc = { version = "0.2", optional = true }
block = { version = "0.1", optional = true }
mpsgraph = { version = "0.2", optional = true }
hf-hub = "0.4"
tribunus-evidence-schema = { path = "../evidence-schema" }
# MLX is the RESEARCH surface, not the production runtime. Both crates are
# optional and activated only by `mlx-backend`: the production `prism-backend`
# build must compile from a clean checkout (Xcode CLT + Rust + this repo)
# without the out-of-repo MLX source tree that mlx-sys's cmake build fetches.
mlx-rs = { path = "../mlx-rs-fork/mlx-rs", optional = true }
mlx-sys = { path = "../mlx-rs-fork/mlx-sys", optional = true }
safetensors = "0.5"
sha2 = { version = "0.10", features = ["asm"] }
uuid = { version = "1", features = ["v4", "serde"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
strum = { workspace = true }
serde_json = "1"
base64 = "0.22"
toml = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
parking_lot = "0.12"
notify = "6"
libc = "0.2"
lol_html = "2"
lazy_static = "1.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", optional = true }
 futures = "0.3"
tower-http = { version = "0.6", optional = true, features = ["cors"] }
async-trait = "0.1"
thiserror = "2"
coreml-proto = { version = "0.1.0", optional = true }
prost = "0.14.4"
prost-types = "0.14.4"
swc_common = { version = "23", default-features = false, features = [] }
swc_ecma_ast = { version = "25", default-features = false, features = [] }
swc_ecma_parser = { version = "41", default-features = false, features = [] }
tempfile = { version = "3" }
png = "0.17"
blake3 = "1"
serde_json_canonicalizer = "0.3"
memmap2 = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
half = "2"
clap = { version = "4", features = ["derive"] }
tar = "0.4"
walkdir = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
content_inspector = "0.2"
encoding_rs = "0.8"
deno_core = "0.405"
deno_core_icudata = "0.77"
anyhow = "1.0.102"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }

[features]
default = []
# ── The three build surfaces (PRODUCTION_CONTRACT.md) ──────────────────────
# 1. PRODUCTION RUNTIME — Metal dispatch, CoreML, orchestrator, distill
#    worker, taps, fused decode. Hermetic: compiles from a clean checkout
#    with Xcode CLT + Rust only. Does NOT imply mlx-backend.
prism-backend = ["dep:coreml-proto", "server", "metal-dispatch", "backend-metal", "dep:image"]
# 2. RESEARCH — the MLX executor/model stack and everything built on it.
#    Requires the MLX source tree (see mlx-rs-fork/mlx-sys/build.rs).
mlx-backend = ["dep:mlx-rs", "dep:mlx-sys", "prism-backend"]
# Convenience alias for the pre-split meaning of prism-backend (both surfaces).
research = ["prism-backend", "mlx-backend"]
# 3. TOOLING — packers, reference harnesses, admission tools ride whichever
#    surface they need via per-bin required-features; std-only tools ride none.
ffi = ["prism-backend"]
ane = []
metal-dispatch = ["dep:metal", "dep:objc", "dep:block"]
server = ["dep:axum", "dep:tower-http"]

# Opt-in vendor GPU probes. Each links a vendor runtime (`libamdhip64`,
# `libze_loader`) that only exists on machines with that SDK installed, so
# they MUST stay off by default — an unconditional `#[link]` in either probe
# breaks the link step of every Linux build on machines without the SDK.
rocm-probe = []
level-zero-probe = []

# Features referenced in cfg attributes throughout the codebase.
# These are declared as inactive features so `unexpected_cfgs` lint is clean.
candle-cpu = []
intel = []
tensix = []
storage-adapters = []
backend-cpu = []
napi = []
private-development = []
image = []
msgpack = []
coreai-backend = []

flux-klein-mlx = []
backend-metal = ["dep:mpsgraph"]

# Positive capability gates — independent of execution path.
# Each gates a generation module. Enable with the backend of your choice.
# No feature here removes modules that another feature enabled.
generation-features-moved-to-separate-crates = []

[[bin]]
name = "prism"
path = "src/bin/prism.rs"

[[bin]]
name = "prism-server"
path = "src/bin/prism_server.rs"
required-features = ["prism-backend"]

[[bin]]
name = "prism-alpha"
path = "src/bin/prism_alpha.rs"

[[bin]]
name = "check-gguf-meta"
path = "src/bin/check_gguf_meta.rs"
required-features = ["prism-backend"]

[[bin]]
name = "prism-bench-ab"
path = "src/bin/prism_bench_ab.rs"
required-features = ["prism-backend"]

[build-dependencies]
cc = "1.2"
tar = "0.4"

[[bin]]
name = "verify-ternary"
path = "src/bin/verify_ternary.rs"
required-features = ["prism-backend"]

[[bin]]
name = "q8-scale-dump"
path = "src/bin/q8_scale_dump.rs"
# Imports crate::gguf, which is gated behind these backends (pre-existing
# breakage under plain backend-cpu, surfaced by the hermetic-build split).
required-features = ["prism-backend"]

[[bin]]
name = "tribunus-pack-nf4tile640"
path = "src/bin/tribunus_pack_nf4tile640.rs"
required-features = ["prism-backend"]

[[bin]]
name = "gemma4-inspect"
path = "src/bin/gemma4_inspect.rs"
required-features = ["prism-backend"]

[[bin]]
name = "gemma4-ingest"
path = "src/bin/gemma4_ingest.rs"
required-features = ["prism-backend"]

[[bin]]
name = "qwen25-omni-ingest"
path = "src/bin/qwen25_omni_ingest.rs"
required-features = ["prism-backend"]

[[bin]]
name = "tribunus-compute-image"
path = "src/bin/tribunus-compute-image.rs"
required-features = ["research"]
