[package]
name = "prism-amd-npu-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
prism-ecs-core = { path = "../prism-ecs-core" }
prism-ecs-ir = { path = "../prism-ecs-ir" }

[features]
default = []
# Enables AMD XDNA NPU runtime support.
# No-op on non-Linux platforms.
amd-npu-runtime = []

# Standalone workspace (not part of the top-level workspace due to
# potential cyclic dependency with prism-ecs-ir).
[workspace]
