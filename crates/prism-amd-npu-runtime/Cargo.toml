[package]
name = "prism-amd-npu-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
prism-ecs-core = { path = "../prism-ecs-core" }
prism-ecs-ir = { path = "../prism-ecs-ir" }
prism-spatial-ir = { path = "../prism-spatial-ir" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
libc = "0.2"

[features]
default = []
# Enables AMD XDNA NPU runtime support.
# No-op on non-Linux platforms.
amd-npu-runtime = []
