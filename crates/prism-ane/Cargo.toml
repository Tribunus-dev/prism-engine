[package]
name = "prism-ane"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Apple Neural Engine compiler pipeline — coreml-proto FFI bridge, MIL builder, MLModel compilation"

[dependencies]
coreml-proto = { version = "0.1.0", optional = true }
prost = "0.14"
safetensors = "0.6"
tempfile = "3"
bytemuck = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prism-ecs-ir = { path = "../prism-ecs-ir" }

[build-dependencies]
cc = "1"

[features]
default = []
ane = ["dep:coreml-proto"]
full = ["ane"]
