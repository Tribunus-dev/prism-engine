[package]
name = "prism-ecs-constitutional"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prism ECS constitutional commands — session, work, execution, compilation, multimodal, agent, distributed, and ingress authority systems"

[features]
# Enable the bridge from prism-ecs-quantization's QuantizationResult
# into the constitutional QuantizationResultComponent. Disabled by
# default so the constitutional crate stays free of compiler
# dependencies.
quantization-bridge = ["dep:prism-ecs-quantization", "dep:prism-ecs-ir"]

[dependencies]
prism-ecs-core = { path = "../prism-ecs-core" }
prism-ecs-kernel = { path = "../prism-ecs-kernel" }
serde_json = "1"
blake3 = "1"
serde_json_canonicalizer = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
strum = { workspace = true }
parking_lot = { workspace = true }
prism-ecs-quantization = { path = "../prism-ecs-quantization", optional = true }
prism-ecs-ir = { path = "../prism-ecs-ir", optional = true }
