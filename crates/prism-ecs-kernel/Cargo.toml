[package]
name = "prism-ecs-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable kernel compilation, dispatch, and measurement contracts"

[dependencies]
block = { version = "0.1", optional = true }
half = { workspace = true }
hex = { workspace = true }
libc = { version = "0.2", optional = true }
parking_lot = { version = "0.12", optional = true }
prism-ecs-backend = { path = "../prism-ecs-backend" }
prism-ecs-core = { path = "../prism-ecs-core" }
prism-ecs-ir = { path = "../prism-ecs-ir" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[features]
metal-dispatch = ["dep:metal"]
backend-completion = ["dep:block", "dep:parking_lot"]
backend-unified-arena = ["dep:libc"]
default = ["backend-completion", "backend-unified-arena"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }
