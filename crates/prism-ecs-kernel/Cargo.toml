[package]
name = "prism-ecs-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable kernel compilation, dispatch, and measurement contracts"

[dependencies]
half = { workspace = true }
hex = { workspace = true }
prism-ecs-core = { path = "../prism-ecs-core" }
prism-ecs-ir = { path = "../prism-ecs-ir" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[features]
metal-dispatch = ["dep:metal"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }
