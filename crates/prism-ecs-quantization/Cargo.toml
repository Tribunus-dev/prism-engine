[package]
name = "prism-ecs-quantization"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prism ECS quantization — NF4 tile640, INT8, SymInt4, ternary, mixed-tile, calibration, sweep, and admission pipeline"

[lib]
path = "src/mod.rs"

[dependencies]
prism-ecs-core = { path = "../prism-ecs-core" }
prism-ane = { path = "../prism-ane", optional = true }
regex = "1"
prism-ecs-ir = { path = "../prism-ecs-ir" }
prism-spatial-ir = { path = "../prism-spatial-ir" }
safetensors = "0.5"
memmap2 = "0.9"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
serde_json = "1"
bincode = "1"
tempfile = "3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
half = "2"
strum = { workspace = true }
thiserror = "2"

[features]
gguf-compile = []
ane = ["prism-ane/ane"]
mlx-backend = []
prism-backend = []
prism-backend-ios = []
research = []
ffi = []
metal-dispatch = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ane", "mlx-backend", "prism-backend", "prism-backend-ios", "research", "ffi", "metal-dispatch"))'] }
