[package]
name = "prism-ecs-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prism ECS server — RPCS3-absorbed cell SPU mailbox, DMA, and workgroup patterns"

[dependencies]
uuid = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "time"] }
tempfile = { workspace = true }
prism-ecs-core = { path = "../prism-ecs-core" }
prism-ecs-ir = { path = "../prism-ecs-ir" }
serde = { workspace = true, features = ["derive"] }
prism-video = { path = "../prism-video" }
prism-kv-cache = { path = "../prism-kv-cache" }
prism-multimodal = { path = "../prism-multimodal" }
prism-ecs-duckdb = { path = "../prism-ecs-duckdb" }
prism-ecs-quantization = { path = "../prism-ecs-quantization" }
prism-ecs-compile = { path = "../prism-ecs-compile" }
prism-ecs-runtime = { path = "../prism-ecs-runtime" }
prism-ecs-kernel = { path = "../prism-ecs-kernel" }
prism-spatial-ir = { path = "../prism-spatial-ir" }
half = { workspace = true }
bytemuck = { workspace = true }
blake3 = "1"
rand = { workspace = true }
sha2 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
memmap2 = "0.9"
axum = { version = "0.8", optional = true }
tokio-stream = { version = "0.1", optional = true }
futures = "0.3"
tower-http = { version = "0.6", optional = true, features = ["cors"] }
# AST-level security guard dependencies (tool surface)
lol_html = "2"
swc_common = { version = "23", default-features = false, features = [] }
swc_ecma_ast = { version = "25", default-features = false, features = [] }
swc_ecma_parser = { version = "41", default-features = false, features = [] }
# HTTP client for X-Ray HTML proxy
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# V8-backed sandboxed JavaScript runtime (deno_core is optional; only
# the prism-bridge crate enables the feature flag today).
deno_core = { version = "0.405", optional = true }
deno_core_icudata = { version = "0.77", optional = true }

[features]
gguf-compile = []
measure = []
default = []
server = ["dep:axum", "dep:tower-http", "dep:tokio-stream"]
prism-backend = []
generation-image = []
generation-audio = []
generation-video = []
generation-diffusion = []
metal-dispatch = []
# Enable the V8-backed sandboxed JavaScript runtime (used by
# `tools::js_runtime`). Mirrors the engine's prior `deno_core`
# feature; disabled by default because the JS runtime is a
# heavier dependency than the rest of the tool surface.
deno_core = ["dep:deno_core", "dep:deno_core_icudata"]
