[package]
name = "prism-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prism-video = { path = "../prism-video" }
prism-kv-cache = { path = "../prism-kv-cache" }
prism-multimodal = { path = "../prism-multimodal" }
duckdb = { version = "1.1", optional = true, features = ["bundled"] }
prism-ecs-core = { path = "../prism-ecs-core" }
prism-ecs-quantization = { path = "../prism-ecs-quantization" }
prism-ecs-ir = { path = "../prism-ecs-ir" }
half = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
memmap2 = "0.9"

[features]
duckdb-projections = ["dep:duckdb"]
default = []
metal-dispatch = []
