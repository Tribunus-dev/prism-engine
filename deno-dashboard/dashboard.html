<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Deno Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:.85rem}
.header{background:#161b22;padding:10px 20px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:16px;flex-shrink:0}
.header h1{font-size:1rem;color:#58a6ff;font-weight:600}
.header h1 span{color:#8b949e;font-weight:400}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{padding:5px 14px;border-radius:6px;cursor:pointer;color:#8b949e;font-size:.8rem;background:transparent;border:1px solid transparent;transition:all .1s;white-space:nowrap}
.tab:hover{color:#c9d1d9;background:#21262d}
.tab.active{color:#58a6ff;border-color:#1f6feb44;background:#1f6feb22}
.panel{display:none;flex:1;overflow:hidden}
.panel.active{display:flex;flex-direction:column}
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{flex:1;padding:8px 12px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:.8rem}
.search-row input:focus{outline:1px solid #58a6ff;border-color:#58a6ff}
button.btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:500;transition:background .15s;white-space:nowrap}
.btn-primary{background:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-hf{background:#1f6feb;color:#fff}
.btn-hf:hover{background:#388bfd}
.btn-hf:disabled{opacity:.5;cursor:not-allowed}
.btn-browser{background:#6e40c9;color:#fff}
.btn-browser:hover{background:#8957e5}
.btn-browser:disabled{opacity:.5;cursor:not-allowed}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:8px}
.card h3{font-size:.8rem;color:#58a6ff;margin-bottom:6px}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.65rem;font-weight:500;margin:1px}
.badge-metal{background:#563d7c33;color:#b392f0;border:1px solid #563d7c}
.badge-ane{background:#2188ff22;color:#79c0ff;border:1px solid #2188ff}
.badge-cpu{background:#3fb95022;color:#7ee787;border:1px solid #3fb950}
.agent-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #21262d}
.agent-row:last-child{border:none}
.agent-name{color:#c9d1d9;font-weight:500}
.agent-phase{font-size:.75rem;color:#8b949e}
.phase-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}
.phase-dot.running{background:#3fb950}
.phase-dot.pending{background:#d29922}
.phase-dot.done{background:#58a6ff}
.hw-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.hw-item{background:#21262d;border-radius:6px;padding:10px}
.hw-label{font-size:.7rem;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.hw-value{font-size:1rem;font-weight:600;color:#c9d1d9}
.hw-value.mem{color:#7ee787}
.hw-value.cpu{color:#79c0ff}
.hw-value.metal{color:#b392f0}
.hw-value.ane{color:#d2a8ff}
.result-item{padding:6px 8px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center}
.result-item:last-child{border:none}
.result-name{color:#c9d1d9}
.loading{text-align:center;padding:20px;color:#484f58}
.error{color:#f85149;font-size:.8rem;padding:8px;background:#da363311;border-radius:6px;margin:8px 0}

/* ── Browser tab ──────────────────────────────────── */
.browser-bar{display:flex;gap:6px;padding:8px 12px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;align-items:center}
.browser-bar input.url-input{flex:1;padding:7px 10px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:.8rem}
.browser-bar input.url-input:focus{outline:1px solid #58a6ff;border-color:#58a6ff}
.browser-body{display:flex;flex:1;overflow:hidden}
.browser-viewport{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.browser-viewport .screenshot-wrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px;background:#0d1117;position:relative}
.browser-viewport .screenshot-wrap img{max-width:100%;border-radius:4px;border:1px solid #30363d;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.browser-info{display:flex;gap:12px;padding:6px 12px;background:#161b22;border-top:1px solid #30363d;font-size:.7rem;color:#8b949e;flex-shrink:0;flex-wrap:wrap}
.browser-info .page-stat{display:flex;gap:3px;align-items:center}
.browser-info .page-stat .val{color:#c9d1d9;font-weight:500}
.browser-reasoning{width:300px;min-width:220px;border-left:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.browser-reasoning h3{font-size:.7rem;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-bottom:1px solid #30363d;flex-shrink:0}
.browser-reasoning .log-scroll{flex:1;overflow-y:auto;padding:8px 12px;font-size:.75rem}
.log-entry{margin-bottom:6px;padding:4px 6px;border-radius:4px;border-left:2px solid #30363d}
.log-entry .log-time{color:#484f58;font-size:.65rem}
.log-entry .log-cmd{color:#58a6ff;font-weight:500}
.log-entry .log-args{color:#8b949e}
.log-entry .log-ok{color:#3fb950}
.log-entry .log-err{color:#f85149}
.log-entry.navigate{border-left-color:#58a6ff}
.log-entry.click{border-left-color:#d29922}
.log-entry.type{border-left-color:#b392f0}
.log-entry.highlight{border-left-color:#ff4500}
.log-entry.extract{border-left-color:#7ee787}
.log-entry.screenshot{border-left-color:#6e40c9}
.log-entry.error{border-left-color:#f85149;background:#da363308}

/* Screenshot highlight overlay */
.highlight-overlay{position:absolute;border:3px solid #ff4500;border-radius:3px;pointer-events:none;z-index:10;transition:all .15s;box-shadow:0 0 8px rgba(255,69,0,.5)}
</style>
</head>
<body>
<div class="header">
  <h1>&#x26A1; Prism <span>Desktop</span></h1>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('models')" id="tab-models">Model Browser</div>
    <div class="tab" onclick="switchTab('agents')" id="tab-agents">Agents</div>
    <div class="tab" onclick="switchTab('hardware')" id="tab-hardware">Hardware</div>
    <div class="tab" onclick="switchTab('browser')" id="tab-browser">Agent Browser</div>
  </div>
</div>

<div class="panel active" id="panel-models" style="overflow-y:auto;padding:16px">
  <div class="search-row">
    <input type="text" id="hf-search" placeholder="Search HF repos..." spellcheck="false">
    <button class="btn btn-primary" onclick="searchModels()">Search</button>
  </div>
  <div class="search-row">
    <input type="text" id="hf-pull" placeholder="Pull repo e.g. prism-ml/Bonsai-27B" spellcheck="false">
    <button class="btn btn-hf" onclick="pullModel()">Pull</button>
  </div>
  <div id="model-results"></div>
</div>

<div class="panel" id="panel-agents" style="overflow-y:auto;padding:16px">
  <div id="agent-list"></div>
</div>

<div class="panel" id="panel-hardware" style="overflow-y:auto">
  <div class="hw-grid">
    <div class="hw-item"><div class="hw-label">CPU</div><div class="hw-value cpu" id="hw-cpu">--</div></div>
    <div class="hw-item"><div class="hw-label">Memory</div><div class="hw-value mem" id="hw-mem">--</div></div>
    <div class="hw-item"><div class="hw-label">Metal GPU</div><div class="hw-value metal" id="hw-metal">--</div></div>
    <div class="hw-item"><div class="hw-label">ANE</div><div class="hw-value ane" id="hw-ane">--</div></div>
  </div>
</div>

<div class="panel" id="panel-browser">
  <div class="browser-bar">
    <input type="text" class="url-input" id="browser-url" placeholder="https://example.com" spellcheck="false" value="https://example.com" onkeydown="if(event.key==='Enter')browserNavigate()">
    <button class="btn btn-browser" onclick="browserNavigate()">Go</button>
    <button class="btn btn-primary" onclick="browserScreenshot()">Screenshot</button>
    <button class="btn btn-hf" onclick="browserExtract()">Extract</button>
  </div>
  <div class="browser-body">
    <div class="browser-viewport">
      <div class="screenshot-wrap" id="screenshot-wrap">
        <div class="loading" style="padding:40px">Navigate to a URL to begin</div>
      </div>
      <div class="browser-info" id="browser-info">
        <span class="page-stat">URL: <span class="val" id="bp-url">-</span></span>
        <span class="page-stat">Title: <span class="val" id="bp-title">-</span></span>
        <span class="page-stat">Links: <span class="val" id="bp-links">0</span></span>
        <span class="page-stat">Headings: <span class="val" id="bp-headings">0</span></span>
        <span class="page-stat">Buttons: <span class="val" id="bp-buttons">0</span></span>
      </div>
    </div>
    <div class="browser-reasoning">
      <h3>Agent Reasoning Log</h3>
      <div class="log-scroll" id="reasoning-log">
        <div style="color:#484f58;text-align:center;padding:20px">No actions yet</div>
      </div>
    </div>
  </div>
</div>

<script>
let loadedUrl = '';
let loadedTitle = '';

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'agents') refreshAgents();
  if (name === 'hardware') refreshHardware();
}

async function mcpCall(method, args = {}) {
  const res = await fetch('/api/' + method, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  return res.json();
}

// ── Model Browser ───────────────────────────────────────────
function pushModelResult(r) {
  const list = document.getElementById('model-results');
  const div = document.createElement('div');
  div.className = 'result-item';
  div.innerHTML = `<span class="result-name">${r.name || r}</span>
    <span>${r.metal ? '<span class="badge badge-metal">Metal</span>' : ''}
    ${r.ane ? '<span class="badge badge-ane">ANE</span>' : ''}
    ${r.cpu ? '<span class="badge badge-cpu">CPU</span>' : ''}</span>`;
  list.appendChild(div);
}

async function searchModels() {
  const q = document.getElementById('hf-search').value.trim();
  if (!q) return;
  const list = document.getElementById('model-results');
  list.innerHTML = '<div class="loading">Searching...</div>';
  try {
    const res = await mcpCall('search_hf', { query: q });
    list.innerHTML = '';
    const items = res.result || res.models || res || [];
    (Array.isArray(items) ? items : []).forEach(pushModelResult);
    if (!list.children.length) list.innerHTML = '<div class="loading">No results</div>';
  } catch (e) { list.innerHTML = '<div class="error">Search failed: ' + e.message + '</div>'; }
}

async function pullModel() {
  const repo = document.getElementById('hf-pull').value.trim();
  if (!repo) return;
  const list = document.getElementById('model-results');
  list.innerHTML = '<div class="loading">Pulling ' + repo + '...</div>';
  try {
    const res = await mcpCall('pull_model', { repo });
    list.innerHTML = '';
    pushModelResult(res.result || res.model || { name: repo + ' pulled' });
  } catch (e) { list.innerHTML = '<div class="error">Pull failed: ' + e.message + '</div>'; }
}

// ── Agents ──────────────────────────────────────────────────
async function refreshAgents() {
  const list = document.getElementById('agent-list');
  list.innerHTML = '<div class="loading">Loading agents...</div>';
  try {
    const res = await mcpCall('subagent', { action: 'list' });
    list.innerHTML = '';
    const agents = res.result || res.agents || [];
    if (!Array.isArray(agents) || agents.length === 0) {
      list.innerHTML = '<div class="loading">No agents active</div>';
      return;
    }
    agents.forEach(a => {
      const phase = a.phase || a.status || 'running';
      const dotClass = phase === 'running' || phase === 'generating' ? 'running' : phase === 'done' || phase === 'complete' ? 'done' : 'pending';
      const div = document.createElement('div');
      div.className = 'agent-row';
      div.innerHTML = `<span class="agent-name">${a.name || a.id || 'Agent'}</span>
        <span class="agent-phase"><span class="phase-dot ${dotClass}"></span>${phase}</span>`;
      list.appendChild(div);
    });
  } catch (e) { list.innerHTML = '<div class="error">Failed to load: ' + e.message + '</div>'; }
}

// ── Hardware ────────────────────────────────────────────────
async function refreshHardware() {
  try {
    const res = await mcpCall('inspect_host', {});
    const info = res.result || res || {};
    document.getElementById('hw-cpu').textContent = info.cpu || info.cpu_brand || info.processor || '--';
    const mem = info.memory || info.mem || info.total_memory;
    document.getElementById('hw-mem').textContent = mem ? (mem + ' GB').replace('GB GB','GB') : '--';
    document.getElementById('hw-metal').textContent = info.metal || info.gpu || (info.accelerators && info.accelerators.metal ? 'Available' : '--');
    document.getElementById('hw-ane').textContent = info.ane || info.neural_engine || (info.accelerators && info.accelerators.ane ? 'Available' : '--');
  } catch (e) { /* silent fallback */ }
}

// ── Agent Browser ───────────────────────────────────────────
function logAction(cmd, args, ok, error) {
  const log = document.getElementById('reasoning-log');
  const empty = log.querySelector('.loading');
  if (empty) log.innerHTML = '';

  const entry = document.createElement('div');
  entry.className = 'log-entry ' + cmd;

  const time = new Date().toLocaleTimeString();
  const argsStr = typeof args === 'string' ? args : JSON.stringify(args);

  if (ok) {
    entry.innerHTML = `<div class="log-time">${time}</div>
      <span class="log-cmd">${cmd}</span>
      <span class="log-args">${argsStr}</span>
      <span class="log-ok"> &#x2713;</span>`;
  } else {
    entry.className += ' error';
    entry.innerHTML = `<div class="log-time">${time}</div>
      <span class="log-cmd">${cmd}</span>
      <span class="log-args">${argsStr}</span>
      <div class="log-err">${error || 'Failed'}</div>`;
  }

  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

async function browserNavigate() {
  const url = document.getElementById('browser-url').value.trim();
  if (!url) return;

  const wrap = document.getElementById('screenshot-wrap');
  wrap.innerHTML = '<div class="loading">Navigating...</div>';

  try {
    const res = await mcpCall('browser/navigate', { url });
    loadedUrl = res.url || url;
    loadedTitle = res.title || '';
    logAction('navigate', url, true);
    updatePageInfo(loadedTitle, loadedUrl, 0, 0, 0);
    await browserScreenshot();
  } catch (e) {
    wrap.innerHTML = '<div class="error">Navigation failed: ' + e.message + '</div>';
    logAction('navigate', url, false, e.message);
  }
}

async function browserScreenshot() {
  const wrap = document.getElementById('screenshot-wrap');
  try {
    const res = await mcpCall('browser/screenshot', {});
    const b64 = res.data || res.result?.data || (typeof res === 'string' ? res : null);
    if (!b64) throw new Error('No screenshot data returned');

    wrap.innerHTML = '<img src="data:image/png;base64,' + b64 + '" alt="Page screenshot" id="screenshot-img">';
    logAction('screenshot', '', true);
  } catch (e) {
    if (!wrap.querySelector('.error')) {
      wrap.innerHTML = '<div class="error">Screenshot failed: ' + e.message + '</div>';
    }
    logAction('screenshot', '', false, e.message);
  }
}

async function browserExtract() {
  try {
    const res = await mcpCall('browser/extract', {});
    const info = res.result || res || {};
    loadedTitle = info.title || loadedTitle;
    loadedUrl = info.url || loadedUrl;
    const links = (info.links || []).length;
    const headings = (info.headings || []).length;
    const buttons = (info.buttons || []).length;
    updatePageInfo(loadedTitle, loadedUrl, links, headings, buttons);

    // Log page summary
    const summary = headings + ' headings, ' + links + ' links, ' + buttons + ' buttons';
    logAction('extract', summary, true);
  } catch (e) {
    logAction('extract', '', false, e.message);
  }
}

function updatePageInfo(title, url, links, headings, buttons) {
  document.getElementById('bp-title').textContent = title || '-';
  document.getElementById('bp-url').textContent = url || '-';
  document.getElementById('bp-links').textContent = links;
  document.getElementById('bp-headings').textContent = headings;
  document.getElementById('bp-buttons').textContent = buttons;
}

// Initial load
refreshHardware();
</script>
</body>
</html>
