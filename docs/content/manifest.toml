# Prism Engine docs — canonical content manifest.
#
# This is the durable source of truth for the docs site. Every
# entity declared here is loaded into a `prism-ecs-core::World`
# at build time. The HTML you see at the route is a projection of
# the world; the world is the source.
#
# Adding a new chapter, claim, ADR, or page is a manifest change.
# Adding a new entity kind is a Rust change in
# `crates/prism-docs-content/src/manifest.rs`.

