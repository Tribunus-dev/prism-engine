# Claims
# =========================================================================

[[entity]]
id = "claim:inspectable"
kind = "claim"
text = "ComputeImages are inspectable artifacts. Their identities, layouts, and binding ABIs are content-addressed and reproducible from inputs."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:evidence-preserving"
kind = "claim"
text = "Every execution emits a typed receipt. The receipt carries identity, fencing generation, deadline, artifact digest, and numerical policy."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:replayable"
kind = "claim"
text = "Replay rebuilds state from durable events without re-running external effects. A restart that re-derives state from the event store reconstructs the same canonical world."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:site-is-constitutional"
kind = "claim"
text = "The Prism Engine docs site is itself built on the constitutional ECS. HTML, CSS, and JavaScript are projections of the same world; the manifest is the only source of truth."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:one-subject"
kind = "claim"
text = "There is one and only one canonical subject in flight. Every surface observes the same identity."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:logical-physical-execution"
kind = "claim"
text = "LogicalTensor, PhysicalTileLayout, and ExecutionView are independent contracts. A change to one does not silently rewrite another."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:compiler-as-search"
kind = "claim"
text = "The compiler is a search over representation and placement. The search is a typed operation on the ECS, not hidden heuristics."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:cimage-is-contract"
kind = "claim"
text = "A ComputeImage is a deployment contract, not a renamed checkpoint. It binds logical identity to physical plans, views, and evidence."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:runtime-records-evidence"
kind = "claim"
text = "The runtime queries canonical state, routes work, and records what was proven. Handoffs and terminal outcomes become evidence, not hidden side effects."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:no-dynamic-derivation"
kind = "claim"
text = "Prism compiles policy once and seals the artifact. The runtime does not re-derive deployment strategy at execution time."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:cimage-not-checkpoint"
kind = "claim"
text = "A ComputeImage is more than a renamed model checkpoint. It carries logical identity, physical layouts, execution views, plans, and receipts."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:cimage-six-strata"
kind = "claim"
text = "A ComputeImage has six inspectable strata: metadata, logical tensors, physical layouts, execution views, plan + receipts, and payloads."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:workload-describes-work"
kind = "claim"
text = "A model describes the work. The deployment system describes the machine. The two are separated, not blended."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:deployment-describes-machine"
kind = "claim"
text = "Prism preserves workload semantics while selecting mixed-precision representations, memory tiers, execution lanes, and KV-cache policy for a particular target."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:provider-is-not-accelerator"
kind = "claim"
text = "Prism does not pretend to be the accelerator. The provider owns kernels, queues, memory handles, fabric transport, and device topology."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:constitutional-boundary"
kind = "claim"
text = "Canonical ECS state owns accepted work, lifecycle, ownership, leases, committed outcomes, and terminal failures. Queues, caches, backend handles, and projections remain derived or ephemeral."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:durable-before-ack"
kind = "claim"
text = "Durable state change is recorded before acknowledgement. A result that does not survive a restart is not authoritative."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:replay-rebuilds"
kind = "claim"
text = "A projection can be deleted and rebuilt from the durable event log without re-running any external effect."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:stale-rejected"
kind = "claim"
text = "A result produced for an expired or superseded lease is rejected at the boundary, not silently accepted."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:no-status-inflation"
kind = "claim"
text = "The capability map uses one vocabulary and refuses to inflate status. A Measured claim is not a Verified claim; a Compile-verified path is not a Validated path."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:evidence-bounded-claim"
kind = "claim"
text = "Every claim is bounded by the evidence that supports it. A claim outside its evidence class is a constitutional violation."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:implemented-not-released"
kind = "claim"
text = "Implemented is not the same as released. Prism is pre-1.0 systems software; status is attached to a specific code path, feature set, model, hardware target, and evidence class."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:roadmap-not-status"
kind = "claim"
text = "The roadmap contains only future milestones. Present implementation status lives in the capability registry. Planned work cannot be mistaken for shipped support."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:milestone-needs-evidence"
kind = "claim"
text = "A milestone is complete only when its evidence boundary is visible. Until then, the page is a milestone definition, not a claim that the executable is available."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:source-path-works"
kind = "claim"
text = "The CLI and local OpenAI-compatible server are available from source on Apple Silicon. This is distinct from a future signed, self-contained demo."
class = "illustrative"
state = "observed"

[[entity]]
id = "claim:evidence-scoped"
kind = "claim"
text = "Observed behavior is scoped to the exact commit, build features, model, machine, route, and receipt. Do not generalize one successful run into universal backend support."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:start-with-motivation"
kind = "claim"
text = "The reading path starts with motivation and ends with the source. The vocabulary is consistent across the path."
class = "illustrative"
state = "observed"

[[entity]]
id = "claim:same-vocabulary"
kind = "claim"
text = "Compile-time architecture, numerical admission, target-aware planning, inspectable deployment artifacts, and evidence systems share one vocabulary across the docs."
class = "illustrative"
state = "observed"

[[entity]]
id = "claim:bring-a-system"
kind = "claim"
text = "Partnerships work best when a team can provide a concrete execution boundary, a meaningful workload, and enough evidence to distinguish what is implemented from what is being explored."
class = "illustrative"
state = "observed"

[[entity]]
id = "claim:evidence-stays-honest"
kind = "claim"
text = "Shared interfaces and reproducible fixtures can become open. Proprietary models and deployment constraints remain confidential when the engagement requires it. The evidence class is recorded either way."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:complementary-by-construction"
kind = "claim"
text = "Prism ML explores training, calibration, progressive quantization, ternarization, mixed precision, and model quality. Prism Engine accepts the resulting artifact and solves deployment questions."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:bonsai-made-it-concrete"
kind = "claim"
text = "The Bonsai Ternary and binary work gave Prism Engine a demanding upstream representation to compile against, validating the central boundary of the architecture."
class = "illustrative"
state = "observed"

[[entity]]
id = "claim:demo-needs-reproducibility"
kind = "claim"
text = "A demo milestone is complete only when a second engineer can reproduce the path and see which parts are measured, which are fallback behavior, and which remain unproven."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:no-invented-numbers"
kind = "claim"
text = "The demo page contains no throughput, latency, memory, or quality measurements. Measurements belong to the executable run and its receipt, not to a static mock interface."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:provider-and-planner"
kind = "claim"
text = "General Compute brings the physical execution system. Prism brings the layer that turns a workload requirement into a legal, inspectable composition across capabilities."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:accelerator-stays-itself"
kind = "claim"
text = "Prism does not flatten MI300X ROCm/HIP, XDNA/XDNA2, or other providers into a generic GPU-shaped abstraction. Provider-specific capabilities remain visible to the planner."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:replay-from-events"
kind = "claim"
text = "A replay reads the durable event log, re-derives the canonical world, and projects to the surface. No external effect is re-executed."
class = "architectural"
state = "verified"

[[entity]]
id = "claim:no-rerun-effects"
kind = "claim"
text = "Replay does not re-run compilation, inference, network requests, file writes, or device allocation. It re-derives state from durable facts."
class = "architectural"
state = "verified"
