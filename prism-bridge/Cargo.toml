[package]
name = "prism-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
name = "prism_bridge"

[features]
default = ["research"]

deno_core = ["tribunus-compute-core/deno_core"]

# macOS surface — includes MLX, server, and everything.
research = ["tribunus-compute-core/research", "deno_core"]

# iOS surface — Metal dispatch + FFI, no MLX.
# MLX requires the full Xcode macOS SDK + clang metal-cpp headers and
# cannot be compiled for iOS without cross-compiling the entire MLX C++
# source tree (which is not configured for iOS at this time).
ios = ["tribunus-compute-core/prism-backend-ios", "prism-ffi/ios"]

[dependencies]
tribunus-compute-core = { path = "../compute-core", default-features = false }
prism-ffi = { path = "../prism-ffi", default-features = false }
uniffi = { version = "0.27", features = ["cli"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
metal = "0.32"

[build-dependencies]
uniffi = { version = "0.27", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"
required-features = []
