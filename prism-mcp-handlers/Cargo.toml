[package]
name = "prism-mcp-handlers"
version = "0.1.0"
edition = "2021"
description = "MCP tool handlers for prism-mcpd"

[dependencies]
prism-mcp-core = { path = "../prism-mcp-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
uuid.workspace = true
base64 = "0.22"
parking_lot = "0.12"
ureq = { version = "2.12", features = ["json"] }
url = "2"
deno_core = "0.405"
tempfile.workspace = true
