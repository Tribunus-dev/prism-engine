[package]
name = "prism-mcp-lab"
version = "0.1.0"
edition = "2021"

[dependencies]
prism-mcp-core = { path = "../prism-mcp-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
