[package]
name = "prism-mcpd"
version = "0.1.0"
edition = "2021"
description = "Multi-tool MCP daemon with Unix socket transport"

[[bin]]
name = "prism-mcpd"
path = "src/main.rs"

[dependencies]
sysinfo = "0.33"
reqwest = { version = "0.12", features = ["blocking", "json"] }
prism-mcp-core = { path = "../prism-mcp-core" }
prism-mcp-model = { path = "../prism-mcp-model" }
prism-mcp-build = { path = "../prism-mcp-build" }
prism-mcp-kernel = { path = "../prism-mcp-kernel" }
prism-mcp-admission = { path = "../prism-mcp-admission" }
prism-mcp-bench = { path = "../prism-mcp-bench" }
prism-mcp-replay = { path = "../prism-mcp-replay" }
prism-mcp-trace = { path = "../prism-mcp-trace" }
prism-mcp-lab = { path = "../prism-mcp-lab" }
prism-mcp-browser = { path = "../prism-mcp-browser" }
prism-ecs-server = { path = "../crates/prism-ecs-server", default-features = false }
prism-ecs-ir = { path = "../crates/prism-ecs-ir" }
prism-ecs-constitutional = { path = "../crates/prism-ecs-constitutional" }
prism-ecs-core = { path = "../crates/prism-ecs-core" }
prism-ecs-quantization = { path = "../crates/prism-ecs-quantization" }
hf-hub = "0.4"
serde_json = "1"
serde.workspace = true
blake3 = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid.workspace = true
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
signal-hook = "0.3"
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
dirs = "6"
tower-http = { version = "0.6", features = ["cors"] }
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1", "with-chrono-0_4"] }
redis = { version = "0.27", optional = true }

[features]
default = ["trifecta"]
trifecta = ["dep:tokio-postgres", "dep:redis"]
live-trifecta = ["trifecta"]
measure = ["trifecta"]
live-browser = []

[dev-dependencies]
tempfile = "3"
