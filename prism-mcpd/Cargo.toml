[package]
name = "prism-mcpd"
version = "0.1.0"
edition = "2021"
description = "Multi-tool MCP daemon with Unix socket transport"

[[bin]]
name = "prism-mcpd"
path = "src/main.rs"

[dependencies]
prism-mcp-core = { path = "../prism-mcp-core" }
prism-mcp-model = { path = "../prism-mcp-model" }
prism-mcp-build = { path = "../prism-mcp-build" }
prism-mcp-kernel = { path = "../prism-mcp-kernel" }
prism-mcp-admission = { path = "../prism-mcp-admission" }
prism-mcp-bench = { path = "../prism-mcp-bench" }
prism-mcp-replay = { path = "../prism-mcp-replay" }
prism-mcp-trace = { path = "../prism-mcp-trace" }
prism-mcp-lab = { path = "../prism-mcp-lab" }
serde_json = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid.workspace = true
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
signal-hook = "0.3"
tokio = { workspace = true }
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }
redis = { version = "0.27", optional = true }
duckdb = { version = "1.1", optional = true, features = ["bundled"] }

[features]
default = ["trifecta"]
trifecta = ["dep:tokio-postgres", "dep:redis", "dep:duckdb"]

[dev-dependencies]
tempfile = "3"
