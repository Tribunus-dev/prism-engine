<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism Engine Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#161b22;padding:12px 24px;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h1{margin:0;font-size:1.1rem;color:#58a6ff;font-weight:600}
.header h1 span{color:#8b949e;font-weight:400}
#header-model{font-size:.8rem;color:#8b949e;background:#21262d;padding:4px 10px;border-radius:6px;border:1px solid #30363d}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:#0d1117;border-right:1px solid #30363d;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar h2{font-size:.8rem;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;padding:16px 16px 8px}
.model-list{flex:1;overflow-y:auto;padding:0 8px}
.model-item{padding:8px 12px;margin:2px 0;border-radius:6px;cursor:pointer;font-size:.85rem;color:#c9d1d9;transition:background .1s}
.model-item:hover{background:#21262d}
.model-item.active{background:#1f6feb22;color:#58a6ff;border:1px solid #1f6feb44}
.pull-section{padding:12px 16px;border-top:1px solid #30363d}
.pull-section input{width:100%;padding:6px 8px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:.8rem;margin-bottom:6px}
.pull-section input:focus{outline:1px solid #58a6ff;border-color:#58a6ff}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.token-stream{flex:1;overflow-y:auto;padding:16px 20px;font-size:.95rem;line-height:1.6;min-height:0}
.token-stream .msg-user{padding:8px 12px;margin-bottom:8px;background:#1f6feb11;border-radius:8px;border-left:3px solid #58a6ff;color:#c9d1d9}
.token-stream .msg-user strong{color:#58a6ff}
.token-stream .msg-assistant{padding:12px;margin-bottom:8px;background:#161b22;border-radius:8px;border-left:3px solid #3fb950;min-height:24px}
.token-stream .msg-assistant .token-wrap{display:inline}
.token-stream .msg-assistant .tok{display:inline;padding:1px 0;transition:background .15s;cursor:default;position:relative}
.token-stream .msg-assistant .tok:hover{background:#30363d;border-radius:3px}
.token-stream .msg-assistant .tok .tok-meta{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#21262d;border:1px solid #30363d;border-radius:4px;padding:3px 6px;font-size:.65rem;white-space:nowrap;color:#8b949e;z-index:10;pointer-events:none}
.token-stream .msg-assistant .tok:hover .tok-meta{display:block}
.input-area{display:flex;gap:8px;padding:12px 20px 16px;align-items:center;flex-shrink:0}
.input-area input[type=text]{flex:1;padding:10px 14px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:.9rem}
.input-area input[type=text]:focus{outline:none;border-color:#58a6ff}
.input-area button,.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:500;transition:background .15s}
.btn-primary{background:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:#da3633;color:#fff}
.btn-danger:hover{background:#f85149}
.btn-danger:disabled{opacity:.5;cursor:not-allowed}
.btn-hf{background:#1f6feb;color:#fff;width:100%}
.btn-hf:hover{background:#388bfd}
.btn-hf:disabled{opacity:.5;cursor:not-allowed}
.metrics-bar{display:flex;gap:16px;padding:8px 20px;background:#161b22;border-top:1px solid #30363d;font-size:.75rem;color:#8b949e;flex-shrink:0;flex-wrap:wrap}
.metrics-bar .metric{display:flex;align-items:center;gap:4px}
.metrics-bar .metric .val{color:#c9d1d9;font-weight:500}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.streaming-indicator{display:none;width:8px;height:8px;border-radius:50%;background:#3fb950;animation:pulse 1s infinite;margin-right:8px;vertical-align:middle}
.streaming-indicator.active{display:inline-block}
.kv-cache-section{padding:8px 20px 12px;border-top:1px solid #30363d;background:#0d1117;flex-shrink:0;max-height:180px;overflow-y:auto}
.kv-cache-section h3{font-size:.7rem;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kv-bar-row{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:.7rem}
.kv-bar-label{width:60px;text-align:right;color:#8b949e;flex-shrink:0}
.kv-bar-track{flex:1;height:12px;background:#21262d;border-radius:6px;overflow:hidden}
.kv-bar-fill{height:100%;border-radius:6px;transition:width .3s ease;background:linear-gradient(90deg,#58a6ff,#3fb950)}
.kv-bar-pct{width:36px;text-align:right;color:#8b949e;font-size:.65rem}

/* Compilation progress */
.progress-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0d1117ee;z-index:100;align-items:center;justify-content:center}
.progress-overlay.active{display:flex}
.progress-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px 32px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto}
.progress-card h3{margin-bottom:12px;color:#58a6ff}
.progress-bar-track{height:8px;background:#21262d;border-radius:4px;overflow:hidden;margin-bottom:8px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#1f6feb,#3fb950);border-radius:4px;transition:width .3s ease;width:0%}
.progress-status{font-size:.8rem;color:#8b949e;margin-bottom:12px}
.tensor-list{font-size:.75rem;max-height:300px;overflow-y:auto}
.tensor-item{padding:4px 0;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;color:#8b949e}
.tensor-item .tensor-name{color:#c9d1d9;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tensor-item .tensor-meta{color:#8b949e;white-space:nowrap}
</style>
</head>
<body>

<div class="header">
  <h1>&#x26A1; Prism Engine <span>Dashboard</span></h1>
  <span id="header-model">No model selected</span>
</div>

<div class="main">
  <div class="sidebar">
    <h2>Models</h2>
    <div class="model-list" id="model-list">
      <div style="color:#484f58;font-size:.8rem;padding:8px 16px">No models loaded</div>
    </div>
    <div class="pull-section">
      <input type="text" id="hf-repo" placeholder="HF repo e.g. prism-ml/Bonsai-27B" spellcheck="false">
      <button class="btn btn-hf" id="pull-btn" onclick="pullModel()">&#x2B06; Pull &amp; Compile from HF</button>
    </div>
  </div>

  <div class="content">
    <div class="chat-area">
      <div class="token-stream" id="token-stream">
        <div style="color:#484f58;font-size:.85rem;text-align:center;margin-top:40px">Select a model and type a message to begin</div>
      </div>
      <div class="input-area">
        <input type="text" id="prompt-input" placeholder="Type a message..." disabled>
        <button class="btn btn-primary" id="send-btn" onclick="sendMessage()" disabled>Send</button>
        <button class="btn btn-danger" id="stop-btn" onclick="stopGeneration()" disabled>Stop</button>
      </div>
    </div>
    <div class="metrics-bar" id="metrics-bar">
      <span class="metric"><span class="streaming-indicator" id="stream-indicator"></span>Status:</span>
      <span class="metric">tok/s: <span class="val" id="m-tps">-</span></span>
      <span class="metric">tokens: <span class="val" id="m-total">0</span></span>
      <span class="metric">time: <span class="val" id="m-time">-</span></span>
      <span class="metric">memory: <span class="val" id="m-mem">-</span></span>
    </div>
    <div class="kv-cache-section" id="kv-section">
      <h3>KV Cache Utilization</h3>
      <div id="kv-bars"></div>
    </div>
  </div>
</div>

<!-- Compilation progress overlay -->
<div class="progress-overlay" id="progress-overlay">
  <div class="progress-card">
    <h3>&#x1F4E6; Pulling &amp; Compiling Model</h3>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-status" id="progress-status">Starting...</div>
    <div class="tensor-list" id="tensor-list"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
let currentModel = null;
let genWs = null;
let isGenerating = false;
let tokenCount = 0;
let kvData = {};

// ── WebSocket: Model list ───────────────────────────────────────────────
function connectModelsWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/api/models/ws`);
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.models) renderModelList(data.models);
    } catch(_) {}
  };
  ws.onclose = () => setTimeout(connectModelsWs, 2000);
}
connectModelsWs();

function renderModelList(models) {
  const el = document.getElementById('model-list');
  if (!models || models.length === 0) {
    el.innerHTML = '<div style="color:#484f58;font-size:.8rem;padding:8px 16px">No models loaded</div>';
    return;
  }
  el.innerHTML = models.map(m =>
    `<div class="model-item${m === currentModel ? ' active' : ''}" onclick="selectModel('${m.replace(/'/g,"\\'")}')">${m}</div>`
  ).join('');
}

function selectModel(name) {
  currentModel = name;
  document.getElementById('header-model').textContent = `Model: ${name}`;
  document.getElementById('prompt-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  document.querySelectorAll('.model-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.model-item').forEach(el => {
    if (el.textContent.trim() === name) el.classList.add('active');
  });
  addSystemMessage(`Switched to model: ${name}`);
}

// ── WebSocket: Generation ──────────────────────────────────────────────

function connectGenWs() {
  if (genWs && genWs.readyState === WebSocket.OPEN) return genWs;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  genWs = new WebSocket(`${proto}//${location.host}/api/ws`);
  return genWs;
}

function sendMessage() {
  const input = document.getElementById('prompt-input');
  const prompt = input.value.trim();
  if (!prompt || !currentModel || isGenerating) return;

  input.value = '';
  addUserMessage(prompt);
  startGeneration(prompt);
}

function startGeneration(prompt) {
  const ws = connectGenWs();
  isGenerating = true;
  tokenCount = 0;
  document.getElementById('stop-btn').disabled = false;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('stream-indicator').classList.add('active');
  document.getElementById('m-mem').textContent = '-';

  // Create assistant message container
  const stream = document.getElementById('token-stream');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg-assistant';
  msgDiv.innerHTML = '<strong style="color:#3fb950">Prism:</strong> <span class="token-wrap"></span>';
  stream.appendChild(msgDiv);
  const tokenWrap = msgDiv.querySelector('.token-wrap');
  stream.scrollTop = stream.scrollHeight;

  let buf = '';
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.token !== undefined) {
        // Per-token update
        tokenCount++;
        const tok = document.createElement('span');
        tok.className = 'tok';
        tok.textContent = data.token;
        if (data.metrics) {
          const meta = document.createElement('span');
          meta.className = 'tok-meta';
          meta.textContent = `${data.metrics.tokens_per_sec.toFixed(1)} tok/s | ${data.metrics.time_ms.toFixed(0)}ms | L${data.metrics.layer}`;
          tok.appendChild(meta);
        }
        tokenWrap.appendChild(tok);
        updateMetrics(data.metrics);
        stream.scrollTop = stream.scrollHeight;
      } else if (data.kv_cache) {
        const k = data.kv_cache;
        kvData[k.layer] = k.cache_utilization_pct;
        renderKvBars();
      } else if (data.metrics) {
        // Aggregate metrics at end
        const m = data.metrics;
        document.getElementById('m-tps').textContent = m.avg_tokens_per_sec.toFixed(1);
        document.getElementById('m-total').textContent = m.total_tokens;
        document.getElementById('m-time').textContent = (m.total_time_ms/1000).toFixed(1) + 's';
        document.getElementById('m-mem').textContent = m.peak_memory_mb + ' MB';
      } else if (data.Finished !== undefined || data.Stopped !== undefined) {
        // Done
        endGeneration(data.Finished !== undefined);
      } else if (data.error) {
        addSystemMessage('Error: ' + data.error);
        endGeneration(false);
      }
    } catch(_) {}
  };

  ws.onopen = () => {
    ws.send(JSON.stringify({
      command: 'generate',
      model: currentModel,
      prompt: prompt,
      max_tokens: 256
    }));
  };

  ws.onclose = () => {
    endGeneration(false);
  };
}

function endGeneration(completed) {
  isGenerating = false;
  document.getElementById('stop-btn').disabled = true;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('stream-indicator').classList.remove('active');
  genWs = null;
  if (!completed) addSystemMessage('Generation stopped');
}

function stopGeneration() {
  if (genWs && genWs.readyState === WebSocket.OPEN) {
    genWs.send(JSON.stringify({command: 'stop'}));
  }
}

// ── UI helpers ─────────────────────────────────────────────────────────

function addUserMessage(text) {
  const stream = document.getElementById('token-stream');
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.innerHTML = '<strong style="color:#58a6ff">You:</strong> ' + escapeHtml(text);
  stream.appendChild(div);
  stream.scrollTop = stream.scrollHeight;
}

function addSystemMessage(text) {
  const stream = document.getElementById('token-stream');
  const div = document.createElement('div');
  div.style.cssText = 'color:#8b949e;font-size:.8rem;padding:4px 0;text-align:center';
  div.textContent = text;
  stream.appendChild(div);
  stream.scrollTop = stream.scrollHeight;
}

function updateMetrics(metrics) {
  if (!metrics) return;
  document.getElementById('m-tps').textContent = metrics.tokens_per_sec.toFixed(1);
  document.getElementById('m-total').textContent = tokenCount;
}

function renderKvBars() {
  const container = document.getElementById('kv-bars');
  const layers = Object.keys(kvData).sort((a,b) => a - b);
  if (layers.length === 0) {
    container.innerHTML = '<div style="color:#484f58;font-size:.7rem">Waiting for data...</div>';
    return;
  }
  container.innerHTML = layers.map(l => {
    const pct = kvData[l];
    const color = pct > 80 ? '#f85149' : pct > 50 ? '#d29922' : '#3fb950';
    return `<div class="kv-bar-row">
      <span class="kv-bar-label">L${l}</span>
      <div class="kv-bar-track"><div class="kv-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,#58a6ff,${color})"></div></div>
      <span class="kv-bar-pct">${Math.round(pct)}%</span>
    </div>`;
  }).join('');
}

// ── Pull from HF ───────────────────────────────────────────────────────

function pullModel() {
  const repo = document.getElementById('hf-repo').value.trim();
  if (!repo) return;

  const btn = document.getElementById('pull-btn');
  btn.disabled = true;
  btn.textContent = 'Pulling...';

  // Show progress overlay
  const overlay = document.getElementById('progress-overlay');
  overlay.classList.add('active');
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-status').textContent = 'Connecting to HuggingFace...';
  document.getElementById('tensor-list').innerHTML = '';

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/api/pull`);
  let tensorCount = 0;

  ws.onopen = () => {
    ws.send(JSON.stringify({repo}));
  };

  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.progress) {
        document.getElementById('progress-status').textContent = data.progress;
      } else if (data.tensor) {
        tensorCount++;
        const list = document.getElementById('tensor-list');
        const item = document.createElement('div');
        item.className = 'tensor-item';
        const name = data.tensor.split('.').slice(-3).join('.');
        item.innerHTML = `<span class="tensor-name">${name}</span><span class="tensor-meta">${data.dim_m}x${data.dim_n} bpp=${data.bpp.toFixed(2)} ${data.elapsed_sec.toFixed(2)}s</span>`;
        list.appendChild(item);
        list.scrollTop = list.scrollHeight;
        document.getElementById('progress-status').textContent = `Compiling: ${tensorCount} tensors done`;
      } else if (data.status === 'done') {
        document.getElementById('progress-fill').style.width = '100%';
        document.getElementById('progress-status').textContent = `Done! Model: ${data.name}`;
        setTimeout(() => {
          overlay.classList.remove('active');
          selectModel(data.name);
        }, 1000);
      } else if (data.error) {
        document.getElementById('progress-status').textContent = 'Error: ' + data.error;
        document.getElementById('progress-status').style.color = '#f85149';
      }
    } catch(_) {}
  };

  ws.onclose = () => {
    btn.disabled = false;
    btn.textContent = '\u2B06 Pull & Compile from HF';
  };
}

// ── Utilities ──────────────────────────────────────────────────────────
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Enter key to send
document.getElementById('prompt-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('hf-repo').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); pullModel(); }
});

// Set KV bars placeholder
renderKvBars();
</script>
</body>
</html>
