<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" role="img" aria-labelledby="t d">
  <title id="t">Prism authority planes</title><desc id="d">Callers submit commands to the authority plane, which controls execution and produces durable evidence and rebuildable projections.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#1d4938"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#181a18}.h{font-size:15px;font-weight:700}.s{font-size:11px;fill:#5e615c}.plane{fill:#f6f0e4;stroke:#181a18;stroke-width:1.5}.authority{fill:#1d4938;stroke:#1d4938}.white{fill:white}.line{fill:none;stroke:#1d4938;stroke-width:2;marker-end:url(#a)}.dash{fill:none;stroke:#9d4e2f;stroke-width:1.5;stroke-dasharray:5 4}</style></defs>
  <rect x="22" y="18" width="476" height="62" rx="4" class="plane"/><text x="42" y="45" class="h">Callers and bridges</text><text x="42" y="64" class="s">CLI · HTTP · Swift · Node · C ABI</text>
  <path d="M260 80v40" class="line"/><text x="274" y="105" class="s">commands / queries</text>
  <rect x="22" y="123" width="476" height="112" rx="4" class="authority"/><text x="42" y="153" class="h white">AUTHORITY PLANE · Constitutional ECS</text><text x="42" y="177" class="s white">identity · components · lifecycle · transactions</text><text x="42" y="199" class="s white">resource claims · leases · validation · effects</text><text x="42" y="219" class="s white">the only plane allowed to admit domain truth</text>
  <path d="M154 235v46" class="line"/><path d="M366 235v46" class="line"/>
  <rect x="22" y="284" width="235" height="106" rx="4" class="plane"/><text x="42" y="314" class="h">EXECUTION PLANE</text><text x="42" y="338" class="s">backend handles · queues · caches</text><text x="42" y="357" class="s">tensor memory · kernels · outcomes</text><text x="42" y="376" class="s">ephemeral and hardware-specific</text>
  <rect x="274" y="284" width="224" height="106" rx="4" class="plane"/><text x="294" y="314" class="h">EVIDENCE PLANE</text><text x="294" y="338" class="s">durable events · receipts</text><text x="294" y="357" class="s">artifact digests · replay registry</text><text x="294" y="376" class="s">durable before acknowledgement</text>
  <path d="M257 337h17" class="dash"/><path d="M386 390v42" class="line"/>
  <rect x="150" y="435" width="248" height="52" rx="4" class="plane"/><text x="174" y="457" class="h">PROJECTION PLANE</text><text x="174" y="476" class="s">rebuildable dashboards and analytical views</text>
</svg>
