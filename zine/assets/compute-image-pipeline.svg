<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" role="img" aria-labelledby="t d">
  <title id="t">Compute image compiler pipeline</title><desc id="d">Model sources pass through ingestion, phase planning, lowering, packaging, and qualification to produce an admitted compute image.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#1d4938"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#181a18}.h{font-size:14px;font-weight:700}.s{font-size:11px;fill:#5e615c}.box{fill:#f6f0e4;stroke:#1d4938;stroke-width:2}.accent{fill:#1d4938}.accentText{fill:white}.flow{fill:none;stroke:#1d4938;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect x="8" y="18" width="145" height="92" rx="3" class="box"/><text x="25" y="48" class="h">Model source</text><text x="25" y="70" class="s">safetensors / GGUF</text><text x="25" y="87" class="s">config + tokenizer</text>
  <path d="M153 64h46" class="flow"/><rect x="202" y="18" width="145" height="92" rx="3" class="box"/><text x="219" y="48" class="h">Ingest + inspect</text><text x="219" y="70" class="s">identity · shapes</text><text x="219" y="87" class="s">source provenance</text>
  <path d="M347 64h46" class="flow"/><rect x="396" y="18" width="116" height="92" rx="3" class="box"/><text x="413" y="48" class="h">Phase IR</text><text x="413" y="70" class="s">DAG · layouts</text><text x="413" y="87" class="s">residency plan</text>
  <path d="M454 110v48H270v28" class="flow"/><rect x="185" y="189" width="170" height="96" rx="3" class="accent"/><text x="210" y="225" class="h accentText">Compute image</text><text x="210" y="249" class="s accentText">versioned artifact</text><text x="210" y="267" class="s accentText">weights + plan + evidence</text>
  <path d="M185 237H86" class="flow"/><rect x="8" y="189" width="132" height="96" rx="3" class="box"/><text x="25" y="219" class="h">Native lowering</text><text x="25" y="242" class="s">Metal today</text><text x="25" y="260" class="s">portable targets next</text>
  <path d="M355 237h53" class="flow"/><rect x="411" y="189" width="101" height="96" rx="3" class="box"/><text x="426" y="219" class="h">Validate</text><text x="426" y="242" class="s">ABI · digest</text><text x="426" y="260" class="s">numerical gate</text>
  <path d="M461 285v43H270v26" class="flow"/><rect x="152" y="357" width="236" height="60" rx="3" class="box"/><text x="180" y="383" class="h">Admitted artifact + receipt</text><text x="180" y="401" class="s">qualified only for the proven execution cell</text>
</svg>
