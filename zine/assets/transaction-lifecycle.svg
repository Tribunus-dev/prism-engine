<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" role="img" aria-labelledby="t d">
  <title id="t">Transactional execution lifecycle</title><desc id="d">A command is validated, planned, executed, checked, committed and replayed, with rejection paths for invalid or stale outcomes.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#1d4938"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#181a18}.n{font-size:12px;font-weight:700}.s{font-size:10px;fill:#5e615c}.box{fill:#f6f0e4;stroke:#1d4938;stroke-width:1.6}.hot{fill:#1d4938}.white{fill:white}.flow{fill:none;stroke:#1d4938;stroke-width:2;marker-end:url(#a)}.reject{fill:none;stroke:#9d4e2f;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#a)}</style></defs>
  <rect x="178" y="12" width="164" height="52" rx="26" class="box"/><text x="226" y="34" class="n">COMMAND</text><text x="203" y="51" class="s">stable identity + intent</text><path d="M260 64v32" class="flow"/>
  <rect x="157" y="99" width="206" height="62" rx="4" class="box"/><text x="211" y="125" class="n">PREFLIGHT</text><text x="183" y="144" class="s">schema · generation · invariants</text><path d="M260 161v32" class="flow"/>
  <rect x="157" y="196" width="206" height="62" rx="4" class="box"/><text x="194" y="222" class="n">TRANSACTION PLAN</text><text x="181" y="241" class="s">effects · claims · expected outcome</text><path d="M260 258v32" class="flow"/>
  <rect x="157" y="293" width="206" height="62" rx="4" class="hot"/><text x="196" y="319" class="n white">EXECUTE EFFECT</text><text x="187" y="338" class="s white">backend work outside authority</text><path d="M260 355v32" class="flow"/>
  <rect x="157" y="390" width="206" height="62" rx="4" class="box"/><text x="189" y="416" class="n">VALIDATE OUTCOME</text><text x="184" y="435" class="s">lease · digest · resource · freshness</text>
  <path d="M157 130H62v291h95" class="reject"/><text x="17" y="263" class="n" fill="#9d4e2f" transform="rotate(-90 17 263)">REJECT INVALID</text>
  <path d="M363 421h86v-291h-86" class="reject"/><text x="482" y="315" class="n" fill="#9d4e2f" transform="rotate(90 482 315)">REJECT STALE</text>
  <path d="M260 452v24h-91" class="flow"/><rect x="18" y="458" width="150" height="28" rx="3" class="hot"/><text x="49" y="477" class="n white">COMMIT + RECEIPT</text>
  <path d="M168 472h174" class="flow"/><rect x="345" y="458" width="157" height="28" rx="3" class="box"/><text x="380" y="477" class="n">ACK + REPLAY</text>
</svg>
